<html xmlns:wicket="http://wicket.apache.org">
<body>
  <wicket:panel>
    <!--
      Click targets for the page-wide paging shortcuts. The shortcut library binds a key by
      emitting document.getElementById(id).click(), so each binding needs a real element to
      click. These are not controls: they are hidden from view and from assistive technology,
      and the visible arrows in each editor's paging navigator carry the shortcut hint.

      display:none rather than visibility/opacity so they take no space and are never focusable.
    -->
    <div style="display: none;" aria-hidden="true">
      <a wicket:id="showFirst" tabindex="-1"></a>
      <a wicket:id="showPrevious" tabindex="-1"></a>
      <a wicket:id="showNext" tabindex="-1"></a>
      <a wicket:id="showLast" tabindex="-1"></a>
    </div>
  </wicket:panel>
</body>
</html>
