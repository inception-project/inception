splitEditor=Split into a second editor
unsplitEditor=Close the second editor
scrollSync=Synchronize scrolling between the two editors
scrollSync.NO_EDITOR=Scroll synchronization needs two editors
scrollSync.NO_DOCUMENT=Scroll synchronization is unavailable while an editor shows no document
scrollSync.MIXED_PAGING=Scroll synchronization is unavailable while only one of the two editors is paged
scrollSync.DIFFERENT_PAGING=Scroll synchronization is unavailable while the two editors page differently
scrollSync.DIFFERENT_DOCUMENTS=Scroll synchronization is unavailable while paged editors show different documents
