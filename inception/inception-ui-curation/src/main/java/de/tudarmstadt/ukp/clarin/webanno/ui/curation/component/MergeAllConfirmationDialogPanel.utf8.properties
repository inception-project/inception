title=Merge all annotations?
message=Merge up to {0} {1} annotation(s) from {2} into the curation?
explanation=Merging all annotations of a layer cannot be undone. Where the curation already has a different annotation at the same position, it is overwritten unless the layer allows stacking. Annotations that are already in the curation are skipped.
