<html xmlns:wicket="http://wicket.apache.org">
<wicket:panel>
  <div wicket:id="documentEditorPanel" class="flex-content flex-v-container"></div>
  <div wicket:id="openDialog"></div>

  <!-- Sidebar-specific action bar items, injected into the document editor panel's action bar. -->
  <wicket:fragment wicket:id="openDocumentItem">
    <div class="btn-group">
      <button wicket:id="showOpenDocumentDialog" class="btn btn-action-bar" type="button"
              title="Open document">
        <i class="far fa-folder-open"></i>
      </button>
    </div>
  </wicket:fragment>

  <wicket:fragment wicket:id="scrollSyncItem">
    <div wicket:id="scrollSyncGroup" class="btn-group">
      <button wicket:id="toggleScrollSync" class="btn btn-action-bar" type="button">
        <i wicket:id="toggleScrollSyncIcon"/>
      </button>
    </div>
  </wicket:fragment>
</wicket:panel>
</html>
